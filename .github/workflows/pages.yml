name: Deploy static frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Pages artifact
        env:
          VAX_API_BASE: ${{ vars.VAX_API_BASE }}
        run: |
          mkdir -p _site
          cp public/* _site/
          node -e 'const fs=require("fs"); const base=process.env.VAX_API_BASE || ""; fs.writeFileSync("_site/config.js", `// Generated by GitHub Actions\nwindow.VAX_API_BASE = ${JSON.stringify(base)};\n`)'
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
