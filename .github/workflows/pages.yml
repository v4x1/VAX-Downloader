name: Deploy static frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Pages artifact
        env:
          VAX_API_BASE: ${{ vars.VAX_API_BASE }}
        run: |
          mkdir -p _site/public
          cp public/* _site/
          # The optional VAX_API_BASE repository variable overrides the committed public/config.js.
          node <<'EOF'
          const fs = require('node:fs');
          const raw = (process.env.VAX_API_BASE || '').trim();
          if (!raw) {
            console.log('VAX_API_BASE is not set; publishing the committed public/config.js.');
            process.exit(0);
          }
          let url = null;
          try { url = new URL(raw); } catch {}
          if (!url || url.protocol !== 'https:' || url.username || url.password || url.search || url.hash) {
            console.log('::error::VAX_API_BASE must be the https:// address of the API server, e.g. https://vax-downloader.onrender.com');
            process.exit(1);
          }
          // app.js appends /api/<route>, so drop trailing slashes and an accidental /api suffix.
          const base = `${url.origin}${url.pathname}`.replace(/\/+$/, '').replace(/\/api$/i, '');
          fs.writeFileSync('_site/config.js', `// Generated by GitHub Actions from the VAX_API_BASE repository variable.\nwindow.VAX_API_BASE = ${JSON.stringify(base)};\n`);
          console.log(`API base: ${base}`);
          EOF
          # The app used to be served from /public/ ; send old links to the site root.
          printf '%s\n' '<!doctype html><html lang="en"><meta charset="utf-8"><title>VAX Downloader</title><meta http-equiv="refresh" content="0; url=../"><link rel="canonical" href="../"><a href="../">Open VAX Downloader</a></html>' > _site/public/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
